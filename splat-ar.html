<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Splat AR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root { --ink: #ffffff; --muted: rgb(255 255 255 / .78); --accent: #e46a9e; --accent-ink: #1a0d14; --scrim: rgb(20 18 24 / .72); }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141218; color: var(--ink); font: 15px/1.45 "IBM Plex Sans", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* The engine's three.js renderer writes the canvas's pixel size into its inline CSS size; !important keeps it
     filling the screen, so the drawing buffer can be smaller than the screen without the view zooming in. */
  #ar-canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; display: block; touch-action: none; }
  .panel { position: fixed; left: 16px; right: 16px; bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none; }
  .panel > * { pointer-events: auto; }
  .hint { display: inline-block; max-width: 420px; white-space: pre-line; padding: 10px 14px; border-radius: 12px; background: var(--scrim); color: var(--ink); text-align: center; pointer-events: none !important; }
  .hint.nudge { animation: nudge .45s ease; }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .sizer { display: flex; gap: 10px; align-items: center; padding: 6px 6px 6px 16px; border-radius: 999px; background: var(--scrim); box-shadow: 0 4px 14px rgb(0 0 0 / .25); }
  .sizer input { width: min(46vw, 220px); accent-color: var(--accent); height: 28px; margin: 0; }
  .sizer .btn { padding: 10px 14px; min-width: 92px; }
  .btn { font: 600 15px/1 "IBM Plex Sans", system-ui, sans-serif; border: 0; border-radius: 999px; padding: 13px 20px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 14px rgb(0 0 0 / .25); }
  .btn:focus-visible, .seg button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btn.ghost { background: var(--scrim); color: var(--ink); }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--scrim); box-shadow: 0 4px 14px rgb(0 0 0 / .25); }
  .seg button { font: 600 15px/1 "IBM Plex Sans", system-ui, sans-serif; border: 0; border-radius: 999px; padding: 10px 16px; background: transparent; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  #exit { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; background: var(--scrim); color: var(--ink); padding: 10px 14px; }
  #dbg { position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 12px; right: 12px; margin: 0; padding: 6px 8px; border-radius: 8px; background: var(--scrim);
    font: 11px/1.35 "IBM Plex Mono", ui-monospace, monospace; white-space: pre-wrap; pointer-events: none; }
  #start-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  #start-screen h1 { font-size: 22px; margin: 0; }
  #start-screen p { margin: 0; color: var(--muted); max-width: 360px; }
  .legal { position: fixed; right: 10px; bottom: calc(4px + env(safe-area-inset-bottom)); margin: 0; font: 10px/1.3 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); }
  .legal a { color: inherit; }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
    }
  }
</script>
</head>
<body>
<canvas id="ar-canvas" hidden></canvas>

<div id="start-screen">
  <h1>View on your table</h1>
  <p>Allow camera and motion access when asked, then point the phone at a table.</p>
  <button class="btn" id="start" type="button" disabled>Loading AR…</button>
  <p id="error" hidden></p>
</div>

<button class="btn" id="exit" type="button" hidden>✕ Close</button>
<pre id="dbg" hidden></pre>
<div class="panel" id="panel" hidden>
  <span class="hint" id="hint">Tap the screen to place it<br>(aim at the table to set it on it)</span>
  <div class="row" id="tools" hidden>
    <div class="seg" role="group" aria-label="One-finger gesture">
      <button type="button" id="mode-move" aria-pressed="true">Move</button>
      <button type="button" id="mode-rotate" aria-pressed="false">Rotate</button>
    </div>
    <button class="btn ghost" id="realign" type="button">Re-align</button>
  </div>
  <div class="sizer" id="sizer" hidden>
    <input type="range" id="size-slider" min="-2" max="1.585" step="0.01" value="0" aria-label="Size, 25 to 300 percent">
    <button class="btn" id="size" type="button" title="Back to real size">Real size</button>
  </div>
</div>
<p class="legal" id="legal" hidden>AR: XR Engine © 2026 Niantic Spatial, Inc. <a href="https://github.com/8thwall/engine/blob/main/LICENSE" target="_blank" rel="noopener">License</a></p>

<script type="module">
  // Full-screen Gaussian splat AR for phones without WebXR (iPhone Safari), opened from splat.html:
  //   splat-ar.html?src=pizza2_splat.sog&h=0.062&w=0.3
  // Camera tracking comes from 8th Wall's XR engine binary (runs inside Safari, absolute scale in
  // metres); the splat is drawn by Spark into the same three.js scene. The model follows the table
  // under the middle of the screen and settles there by itself once the surface holds still (a tap
  // places it at once). Then one finger moves or rotates it (Move / Rotate switch), two fingers
  // twist to rotate and pinch to resize (25-300%), and Re-align hands it back to the automatic
  // placement. It always appears at real size (the splats are scaled to the measured object, and
  // tracking is in metres); the size slider resizes it quickly and its button goes back to real size.
  // While placing, the model shows as a see-through ghost where it will land.
  // Test switches: ?debug=1 shows the camera, resolution and frame rate; ?lens=<label text> forces a
  // camera; ?cam=hd asks for 1920x1080; ?cam=engine leaves the camera choice to the engine;
  // ?rs=<0.5-3> fixes the render scale; ?pdb=1 restores the engine's preserveDrawingBuffer.
  // This product includes the XR Engine software developed by Niantic Spatial, Inc.
  // Copyright © 2026 Niantic Spatial, Inc. All rights reserved.
  // License: https://github.com/8thwall/engine/blob/main/LICENSE
  import * as THREE from "three";
  import { SparkRenderer, SplatMesh, dyno } from "@sparkjsdev/spark";
  import { makeSplatShadow } from "./splat-shadow.js";
  import { makeSlosh } from "./splat-slosh.js";
  import { makeGhostTint } from "./splat-ghost.js";
  import { measureSplat, realSize } from "./splat-size.js";

  const XR_URL = "https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js";
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const startBtn = $("start"), hint = $("hint"), dbg = $("dbg");
  const DEBUG = q.has("debug");
  const camMode = q.get("cam") || "main";
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform)) ||
    (navigator.maxTouchPoints > 1 && !/Android/i.test(navigator.userAgent));  // also iOS builds whose user agent hides it
  const iosVersion = (() => { const m = navigator.userAgent.match(/OS (\d+)[_.](\d+)/); return m ? +m[1] + +m[2] / 100 : 0; })();

  // ---------------------------------------------------------------------------------------------
  // Camera choice. On iOS 16.4+ Safari's facingMode "environment" opens a virtual multi-lens camera
  // (Dual / Triple), which switches lenses by itself. The engine then reopens the camera labelled
  // exactly "Back Camera", and if no label matches it takes the second device in the list. Labels
  // are translated into the phone's language, so outside English that second device can be the
  // Ultra Wide, Telephoto or Triple camera. The licence forbids changing the engine, so this page
  // wraps getUserMedia and sends every back-camera request to the main wide lens instead.
  // The main lens is found without relying on English: every back camera's name extends the plain
  // back camera's name ("Back Camera" -> "Back Triple Camera", "Caméra arrière" -> "Caméra
  // arrière triple"), so among the cameras whose name fits inside the name of the camera Safari
  // opened for "environment", the one with the shortest name is the main lens.
  const camInfo = { label: "", size: "", env: "", note: "", calls: 0, wrapped: false };
  const words = (s) => s.toLowerCase().normalize("NFC").split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const isSubsequence = (a, b) => { let i = 0; for (const ch of b) if (ch === a[i]) i++; return i === a.length; };
  function mainBackCamera(devices, envLabel) {
    const cams = devices.filter((d) => d.kind === "videoinput" && d.label);
    const forced = q.get("lens");
    if (forced) { const f = cams.find((d) => d.label.toLowerCase().includes(forced.toLowerCase())); if (f) return f; }
    const exact = cams.find((d) => d.label === "Back Camera");
    if (exact) return exact;
    if (!envLabel) return null;
    const env = new Set(words(envLabel)), envFlat = words(envLabel).join("");
    const byLength = (a, b) => words(a.label).length - words(b.label).length || a.label.length - b.label.length;
    // Word match first; languages written without spaces (Japanese, Chinese) fall back to a letter match.
    let fits = cams.filter((d) => words(d.label).every((w) => env.has(w)));
    if (fits.length < 2) fits = cams.filter((d) => isSubsequence(words(d.label).join(""), envFlat));
    return fits.sort(byLength)[0] || null;
  }
  window.__splatAr = { mainBackCamera };  // for tests

  if (isIOS && camMode !== "engine" && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    const md = navigator.mediaDevices, gum = md.getUserMedia.bind(md);
    let mainId = null;
    const wantsFront = (v) => JSON.stringify(v.facingMode || "").includes("user");
    const describe = (stream) => {
      const t = stream.getVideoTracks()[0], s = (t && t.getSettings && t.getSettings()) || {};
      camInfo.label = t ? t.label : ""; camInfo.size = s.width ? s.width + "×" + s.height : "";
      return { track: t, settings: s };
    };
    const atLeast = (v, n) => Math.max(n, (v && (v.min || v.exact || v.ideal)) || (typeof v === "number" ? v : 0));
    // Opens the main lens; refuses a front-facing result, so a wrong guess can never show the selfie camera.
    async function openMain(c, video) {
      const { facingMode, deviceId, ...rest } = video;
      const stream = await gum({ ...c, video: { ...rest, deviceId: { exact: mainId } } });
      const { track, settings } = describe(stream);
      if (settings.facingMode === "user") { stream.getTracks().forEach((t) => t.stop()); throw new Error("front camera"); }
      return stream;
    }
    camInfo.wrapped = true;
    md.getUserMedia = async (c) => {
      camInfo.calls++;
      const v = c && c.video;
      if (!v || typeof v !== "object" || wantsFront(v)) return gum(c);
      let video = { ...v, frameRate: { ideal: 30 } };
      // The engine asks for at least 960x720, and Safari answers 1280x720. On a tall phone held upright
      // that shows the same field of view as a 4:3 stream, so only ?cam=hd raises it, for a sharper image.
      if (camMode === "hd") video = { ...video, width: { min: atLeast(v.width, 0), ideal: 1920 }, height: { min: atLeast(v.height, 0), ideal: 1080 } };
      if (mainId) {
        try { return await openMain(c, video); }
        catch (e) { console.warn("[splat-ar] main lens failed, using the engine's camera", e); camInfo.note = "fallback"; mainId = null; return gum({ ...c, video }); }
      }
      const stream = await gum({ ...c, video });
      const { track, settings } = describe(stream);
      camInfo.env = track ? track.label : "";
      let main = null;
      try { main = mainBackCamera(await md.enumerateDevices(), camInfo.env); } catch (e) {}
      if (!main || main.deviceId === settings.deviceId) { mainId = settings.deviceId || null; return stream; }
      mainId = main.deviceId;
      // iOS 16.4+: the engine closes this stream and asks again with a deviceId; that request gets the main lens.
      if (v.deviceId == null && iosVersion >= 16.04) return stream;
      stream.getTracks().forEach((t) => t.stop());
      try { return await openMain(c, video); }
      catch (e) { mainId = null; camInfo.note = "fallback"; return gum({ ...c, video }); }
    };
  }

  // ---------------------------------------------------------------------------------------------
  const src = (q.get("src") || "pizza2_splat.sog").replace(/\.sog$/, "_m.sog");
  const paramW = parseFloat(q.get("w") || "0"), paramH = parseFloat(q.get("h") || "0");
  // GitHub Pages sends big files slowly (about 50 KB/s in Nov 2026 tests), so on the live site the splats come
  // from jsDelivr's mirror of the repo, pinned to a commit that has them. Bump the hash when a .sog changes.
  const ASSETS = location.hostname.endsWith("github.io")
    ? "https://cdn.jsdelivr.net/gh/Snail923/cake-scan-showdown@34d7ea2b32ea84a5ab9688793b5fc6849aed6bfa/" : "";
  // jsDelivr refuses files once a repo version passes its 50 MB limit (403), so check first and fall back to
  // the copy on this site.
  async function splatUrl(file) {
    if (!ASSETS) return file;
    try { const r = await fetch(ASSETS + file, { method: "HEAD" }); if (r.ok) return ASSETS + file; } catch (e) {}
    return file;
  }

  function fail(text, e) {
    if (e) console.error(e);
    $("start-screen").hidden = false; $("ar-canvas").hidden = true; $("panel").hidden = true;
    startBtn.hidden = true; $("error").hidden = false; $("error").textContent = text;
  }

  // Load the engine and its world-tracking chunk before the tap, so XR8.run() can start inside the
  // tap itself (iOS only grants camera and motion access from a user gesture).
  const xrReady = new Promise((resolve, reject) => {
    if (window.XR8) return resolve(window.XR8);
    window.addEventListener("xrloaded", () => resolve(window.XR8), { once: true });
    const s = document.createElement("script");
    s.src = XR_URL; s.crossOrigin = "anonymous"; s.dataset.preloadChunks = "slam";
    s.onerror = () => reject(new Error("could not load the AR engine"));
    document.head.appendChild(s);
  }).then(async (XR8) => { if (XR8.loadChunk) await XR8.loadChunk("slam"); return XR8; });

  const SRC_URL = await splatUrl(src);
  xrReady.then(() => { startBtn.disabled = false; startBtn.textContent = "Start AR"; })
    .catch((e) => fail("The AR engine could not load. Check your connection and try again.", e));

  // ---------------------------------------------------------------------------------------------
  // Render resolution. 8th Wall's own full-window canvas draws at 1 pixel per CSS pixel; iPhones have
  // 3 device pixels per CSS pixel, and splats cost per pixel drawn. Start at up to 2x and step down
  // (to 1x at worst) while the frame rate stays under 24 fps; ?rs= fixes the scale.
  const canvas = $("ar-canvas");
  const fixedScale = q.has("rs") ? Math.min(3, Math.max(0.5, parseFloat(q.get("rs")) || 1)) : 0;
  let renderScale = fixedScale || Math.min(window.devicePixelRatio || 1, 2);
  function sizeCanvas() {
    canvas.width = Math.round(innerWidth * renderScale);
    canvas.height = Math.round(innerHeight * renderScale);
  }
  addEventListener("resize", () => { if (!canvas.hidden) sizeCanvas(); });

  const stats = { frames: 0, since: performance.now(), fps: 0, lastChange: 0, last: 0 };
  function trackFrameRate(now, busy) {
    stats.frames++;
    const span = now - stats.since;
    if (span < 2000) return;
    stats.fps = stats.frames * 1000 / span;
    stats.frames = 0; stats.since = now;
    if (!fixedScale && busy && stats.fps < 24 && renderScale > 1 && now - stats.lastChange > 3000) {
      renderScale = Math.max(1, renderScale - 0.25);
      stats.lastChange = now;
      sizeCanvas();
    }
  }

  // ---------------------------------------------------------------------------------------------
  // The model: the splat plus a soft contact shadow and, while it is being placed, a ring around it.
  // The group eases towards its target pose every frame, so hits and fingers move it smoothly.
  const model = new THREE.Group();
  model.visible = false;
  let splat = null, footprint = 0.15, splatReady = false, shapeShadow = null, fade = 1, realSizeText = "", slosh = null;
  let floating = true;  // placing, no table found yet: the ghost floats in front of the phone
  const target = { pos: new THREE.Vector3(), yaw: 0, scale: 1 };  // scale: on top of the real size
  let state = "searching";  // "searching": follows the table under the screen centre; "placed": stays put

  function blobTexture() {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, "rgba(0,0,0,0.55)"); grad.addColorStop(0.55, "rgba(0,0,0,0.35)"); grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  }
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(1, 48),
    new THREE.MeshBasicMaterial({ map: blobTexture(), transparent: true, depthWrite: false, opacity: q.get("shadow") === "0" ? 0 : 0.8 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.001; shadow.renderOrder = -2;
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.93, 1, 64),
    new THREE.MeshBasicMaterial({ color: 0x8fd3ff, transparent: true, depthWrite: false, opacity: 0.9, side: THREE.DoubleSide }));  // light blue, like the ghost
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.002; ring.renderOrder = -1;
  model.add(shadow, ring);
  function sizeDecor() {
    shadow.scale.setScalar(footprint * 1.15);
    ring.scale.setScalar(footprint * 1.3);
  }
  sizeDecor();


  function setState(next) {
    if (next === "searching") return startSearch();
    state = next;
    $("tools").hidden = false; $("sizer").hidden = false;
    placedHint();
  }
  const atRealSize = () => Math.abs(target.scale - 1) < 0.03;
  function placedHint() {
    hint.textContent = (atRealSize() ? (realSizeText ? "Real size · " + realSizeText : "Real size") : Math.round(target.scale * 100) + "% of real size") + "\n" +
      (mode === "move" ? "Drag to move · twist to rotate · pinch to resize" : "Drag sideways to rotate · pinch to resize");
  }
  function setScale(v) {
    target.scale = Math.min(3, Math.max(0.25, v));
    if (Math.abs(target.scale - 1) < 0.03) target.scale = 1;  // snap to real size
    $("size").textContent = atRealSize() ? "Real size" : Math.round(target.scale * 100) + "% ↺";
    const sl = $("size-slider"); if (document.activeElement !== sl) sl.value = String(Math.log2(target.scale));
    if (state === "placed") placedHint();
  }
  // Back to placing: nothing on screen until the table is found again.
  function startSearch() {
    state = "searching";
    samples.length = 0; stableSince = 0; anchor = null; held = null; reanchor = false; tableLevel = null;
    floating = true; fade = 0; model.userData.floated = false;  // the ghost floats in front of the phone until a table is found
    model.visible = splatReady; if (splat) { splat.visible = splatReady; splat.opacity = 0; } shadow.visible = false;
    ring.material.opacity = 0.9;
    $("tools").hidden = true; $("sizer").hidden = true;
    hint.textContent = waitingHint();
  }

  // ---------------------------------------------------------------------------------------------
  // Surfaces. A tracked hit under a screen point, best type first. ESTIMATED_SURFACE is the engine's
  // guess at the floor, so it only counts when nothing better is there.
  const RANK = { DETECTED_SURFACE: 0, FEATURE_POINT: 1, ESTIMATED_SURFACE: 2 };
  let lastHitType = "", tracking = "", trackingReason = "", normalSince = 0;
  // Like Android: just "point at a table". 8th Wall needs a little camera motion to start tracking, which
  // usually happens while aiming; only if it hasn't started after 4 s does the hint ask for it.
  const waitingHint = () => tracking !== "NORMAL"
    ? "Move your phone slowly left and right\nto start tracking, then tap to place it" : "Tap the screen to place it\n(aim at the table to set it on it)";
  // A table is below the phone and within reach: hits closer than 8 cm, further than 4 m or above the
  // phone are noise.
  function hitAt(XR8, x, y, types = ["DETECTED_SURFACE", "FEATURE_POINT", "ESTIMATED_SURFACE"]) {
    let hits = [];
    try { hits = XR8.XrController.hitTest(x, y, types) || []; } catch (e) { return null; }
    const cam = XR8.Threejs.xrScene().camera.position;
    const ok = (h) => { const d = Math.hypot(h.position.x - cam.x, h.position.y - cam.y, h.position.z - cam.z); return d > 0.08 && d < 4 && h.position.y < cam.y - 0.03; };
    const hit = hits.filter(ok).sort((a, b) => (RANK[a.type] ?? 3) - (RANK[b.type] ?? 3))[0];
    return hit ? { p: new THREE.Vector3(hit.position.x, hit.position.y, hit.position.z), type: hit.type } : null;
  }
  // Where a screen point's ray meets a level plane (the model's table height), within 4 m.
  const raycaster = new THREE.Raycaster();
  function planePoint(camera, clientX, clientY, level) {
    raycaster.setFromCamera(new THREE.Vector2(clientX / innerWidth * 2 - 1, 1 - clientY / innerHeight * 2), camera);
    const p = raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -level), new THREE.Vector3());
    return p && p.distanceTo(camera.position) < 4 ? p : null;
  }
  const faceYaw = (camera, p) => Math.atan2(camera.position.x - p.x, camera.position.z - p.z);

  // Placement: a see-through ghost of the model and a ring show where it will go. A tap places it at once,
  // whenever the user likes: on the table if a few tracked points already agree on one under the ring (the
  // ghost glides onto it), otherwise where the ghost floats. Nothing places itself. After
  // that it never follows the phone: only a finger moves it, or Re-align starts over.
  // 8th Wall reports single tracked points, and from frame to frame the one under the screen centre comes
  // from a different depth, so following the points made the model jump nearer and farther (and look
  // smaller and bigger). Instead the table height is the mean of the recent hits' heights near their
  // median (outliers ignored), and the spot is where the screen-centre ray meets that height, which holds
  // still while the points jump. Placing starts 0.3 s after tracking is NORMAL; the model never shows at a
  // guessed depth (until then it is the floating ghost).
  const samples = [];
  let stableSince = 0, searchStart = 0, anchor = null, tableLevel = null, steadyFrames = 0;
  // Rays: 7 around the screen centre (under the ring, where the user aims) every frame, plus a 5x5 grid over
  // the lower-middle of the screen, a third of it each frame. On a plain table tracked points are sparse, so
  // the more of the view we ask, the sooner some land on it.
  const CENTRE_RAYS = [[0.5, 0.58], [0.44, 0.54], [0.56, 0.54], [0.44, 0.63], [0.56, 0.63], [0.5, 0.5], [0.5, 0.67]];
  const SEARCH_GRID = [];
  for (const ry of [0.42, 0.52, 0.6, 0.7, 0.8]) for (const rx of [0.25, 0.375, 0.5, 0.625, 0.75]) SEARCH_GRID.push([rx, ry]);
  let gridTurn = 0;
  function autoAlign(XR8, camera, now) {
