<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaussian Splat Viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root { --stage: #ebe7ef; --muted: #6b6575; --accent: #a8285f; --accent-ink: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --stage: #24212a; --muted: #a39cad; --accent: #e46a9e; --accent-ink: #1a0d14; }
  }
  :root[data-theme="dark"] { --stage: #24212a; --muted: #a39cad; --accent: #e46a9e; --accent-ink: #1a0d14; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--stage); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .msg { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; font: 12px/1.35 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); pointer-events: none; }
  #xr-btn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font: 600 14px/1 "IBM Plex Sans", system-ui, sans-serif;
    border: 0; border-radius: 999px; padding: 11px 16px; background: var(--accent); color: var(--accent-ink); cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  #overlay .msg { pointer-events: none; }
  #ar8-btn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font: 600 14px/1 "IBM Plex Sans", system-ui, sans-serif;
    border-radius: 999px; padding: 11px 16px; background: var(--accent); color: var(--accent-ink); text-decoration: none; white-space: nowrap;
    box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
  /* During AR the overlay takes every touch for the model: no browser pinch-zoom or scrolling, which would
     also shift the buttons out from under the fingers. */
  #overlay.ar-on { pointer-events: auto; touch-action: none; }
  .ar-pill { position: absolute; font: 14px/1.3 "IBM Plex Sans", system-ui, sans-serif; color: #fff; background: rgb(20 18 24 / .72);
    border: 0; border-radius: 12px; padding: 9px 13px; }
  #ar-hint { left: 50%; bottom: 164px; transform: translateX(-50%); text-align: center; max-width: calc(100% - 32px); pointer-events: none; white-space: pre-line; width: max-content; }
  #ar-tools { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); display: flex; gap: 8px; white-space: nowrap; }
  #ar-sizer { position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    padding: 4px 4px 4px 14px; border-radius: 999px; background: rgb(20 18 24 / .72); white-space: nowrap; }
  #ar-sizer input { width: min(46vw, 220px); accent-color: var(--accent); height: 28px; margin: 0; }
  #ar-sizer .ar-btn { background: var(--accent); color: var(--accent-ink); min-width: 86px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgb(20 18 24 / .72); }
  .seg button, .ar-btn { font: 600 14px/1 "IBM Plex Sans", system-ui, sans-serif; border: 0; border-radius: 999px; padding: 9px 14px; background: transparent; color: #fff; cursor: pointer; }
  .ar-btn { background: rgb(20 18 24 / .72); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button:focus-visible, .ar-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #xr-btn:focus-visible, #ar8-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
    }
  }
</script>
</head>
<body>
<div id="overlay">
  <span class="msg" id="msg">Loading splat…</span>
  <button id="xr-btn" type="button" hidden>View in your room</button>
  <span id="ar-hint" class="ar-pill" hidden></span>
  <div id="ar-tools" hidden>
    <div class="seg" role="group" aria-label="One-finger gesture">
      <button type="button" id="ar-move" aria-pressed="true">Move</button>
      <button type="button" id="ar-rotate" aria-pressed="false">Rotate</button>
    </div>
    <button type="button" id="ar-realign" class="ar-btn">Re-align</button>
  </div>
  <div id="ar-sizer" hidden>
    <input type="range" id="ar-size-slider" min="-2" max="1.585" step="0.01" value="0" aria-label="Size, 25 to 300 percent">
    <button type="button" id="ar-size" class="ar-btn" title="Back to real size">Real size</button>
  </div>
  <a id="ar8-btn" class="xr-link" target="_top" hidden>View on your table</a>
</div>
<script type="module">
  // Gaussian splat viewer for the cards on index.html, loaded in an iframe:
  //   splat.html?src=jar_splat.sog&h=0.26        (h, w = model height and width in metres)
  // Phones get the <name>_m.sog copy (first SH band only). AR uses WebXR where the browser has it
  // (Chrome on Android); other phones (iPhone Safari) open splat-ar.html, which tracks with 8th Wall's engine.
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { SparkRenderer, SplatMesh, dyno } from "@sparkjsdev/spark";
  import { makeSplatShadow } from "./splat-shadow.js";
  import { makeSlosh } from "./splat-slosh.js";
  import { measureSplat, realSize } from "./splat-size.js";

  const q = new URLSearchParams(location.search);
  const phone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  let src = q.get("src") || "jar_splat.sog";
  if (phone) src = src.replace(/\.sog$/, "_m.sog");
  const height = parseFloat(q.get("h") || "0.26");  // model height in metres; it stands on y = 0
  const size = Math.max(height, parseFloat(q.get("w") || "0"));  // frame flat models by their width
  // GitHub Pages sends big files slowly (about 50 KB/s in Nov 2026 tests), so on the live site the splats come
  // from jsDelivr's mirror of the repo, pinned to a commit that has them. Bump the hash when a .sog changes.
  const ASSETS = location.hostname.endsWith("github.io")
    ? "https://cdn.jsdelivr.net/gh/Snail923/cake-scan-showdown@4918dc74df821da8be6f14e415c8f5e8bc04377d/" : "";
  // jsDelivr refuses files once a repo version passes its 50 MB limit (403), so check first and fall back to
  // the copy on this site.
  async function splatUrl(file) {
    if (!ASSETS) return file;
    try { const r = await fetch(ASSETS + file, { method: "HEAD" }); if (r.ok) return ASSETS + file; } catch (e) {}
    return file;
  }
  const msg = document.getElementById("msg");
  const xrBtn = document.getElementById("xr-btn");

  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 50);
  // Phones: cut each Gaussian at 2.5 sigma instead of 2.8 (about 20% less area drawn, the cut-off edge is
  // under 5% opacity) and cap a splat's on-screen radius; the same settings as splat-ar.html.
  scene.add(new SparkRenderer(phone ? { renderer, maxStdDev: 2.5, maxPixelRadius: 256 } : { renderer }));

  const target = new THREE.Vector3(0, height * 0.5, 0);
  const dist = size * 2.2;
  camera.position.set(dist * 0.55, height * 0.5 + dist * 0.45, dist * 0.75);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(target);
  controls.enableDamping = true;
  controls.minDistance = size * 0.6;
  controls.maxDistance = size * 8;
  // Orbit over the top only: a 180° arc from table level on one side, over the top, to the other side.
  // The undersides were never photographed (they are empty and show as haze at grazing angles), so the
  // camera stops about 5° above the table.
  controls.maxPolarAngle = Math.PI * 0.472;
  // Optional ?maxel=<deg>: highest camera elevation the photos covered (e.g. captures without a top ring), so
  // viewers can't orbit into views the splat never learned.
  if (q.get("maxel")) controls.minPolarAngle = Math.PI / 2 - parseFloat(q.get("maxel")) * Math.PI / 180;
  controls.update();

  const splat = new SplatMesh({ url: await splatUrl(src), fileType: "pcsogszip" });
  scene.add(splat);
  // Real size (splat-size.js): measure the splat, scale it to the card's w / h if it is 4-25% off, and keep
  // the label for AR. Then a soft shadow shaped like the object, as a child of the splat so it follows it
  // in AR too (?shadow=0 turns it off).
  const paramW = parseFloat(q.get("w") || "0"), paramH = parseFloat(q.get("h") || "0");
  let baseScale = 1, realSizeText = "", footprint = size / 2, shapeShadow = null, splatReady = false, slosh = null;
  splat.initialized.then(() => {
    msg.hidden = true;
    try {
      const m = measureSplat(splat), r = realSize(m, paramW, paramH);
      baseScale = r.fix; realSizeText = r.text;
      splat.scale.setScalar(baseScale);
      footprint = Math.min(0.4, Math.max(0.04, m.max * baseScale / 2));
    } catch (e) { console.warn(e); }
    if (q.get("shadow") !== "0") { try { shapeShadow = makeSplatShadow(THREE, splat); if (shapeShadow) splat.add(shapeShadow); } catch (e) { console.warn(e); } }
    // ?liquid=1: the juice moves like a liquid when the glass is turned or moved (splat-slosh.js)
    if (q.get("liquid") === "1") { try { slosh = makeSlosh(THREE, dyno, splat, { glint: q.get("glass") === "1" }); window.__slosh = slosh; } catch (e) { console.warn(e); } }
    splatReady = true;
  })
    .catch((e) => { msg.textContent = "Could not load the splat"; console.error(e); });

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();

  // Let the parent page's "Auto-rotate" checkbox drive this viewer too.
  addEventListener("message", (e) => {
    if (e.origin === location.origin && e.data && "spin" in e.data) controls.autoRotate = !!e.data.spin;
  });

  // AR (WebXR, Chrome on Android; ARCore picks the main camera and tracks in metres from the start).
  // Same behaviour as splat-ar.html on iPhone: the model appears on the first real surface under the
  // middle of the screen, at real size, fading in with a ring around it; it follows that surface (height
  // steadied with the median of recent hits, front turned to the phone) and settles by itself once the
  // spot holds still for 1.2 s, or at once on a tap. Then one finger moves or rotates it (Move / Rotate
  // switch), two fingers twist to rotate and pinch to resize (25-300%), the size slider resizes it quickly and
  // its button goes back to real size, and Re-align hands it back to the automatic placement. It always
  // appears at real size; while placing it shows as a see-through ghost where it will land.
  const overlay = document.getElementById("overlay"), hint = document.getElementById("ar-hint"), tools = document.getElementById("ar-tools");
  let xrSession = null, hitSource = null, arState = "searching", mode = "move", gesture = null, downAt = 0, fade = 1;
  const arTarget = { pos: new THREE.Vector3(), yaw: 0, scale: 1 };  // scale: on top of the real size (baseScale)
  const sizeBtn = document.getElementById("ar-size"), sizer = document.getElementById("ar-sizer"), sizeSlider = document.getElementById("ar-size-slider");
  const GHOST = 0.35;
  const samples = [];
  let stableSince = 0, searchStart = 0, lastFrame = 0;
  const raycaster = new THREE.Raycaster();
  const xrCam = () => renderer.xr.getCamera().cameras[0] || renderer.xr.getCamera();

  const ring = new THREE.Mesh(new THREE.RingGeometry(0.93, 1, 64),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false, opacity: 0.9, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.renderOrder = -1; ring.visible = false;
  scene.add(ring);

  function setArState(next) {
    arState = next;
    const placed = next === "placed";
    tools.hidden = !placed; sizer.hidden = !placed;
    if (placed) placedHint();
    else { samples.length = 0; stableSince = 0; ring.material.opacity = 0.9; hint.textContent = splat.visible ? "Tap to place it here, or hold still" : "Point the phone at the table…"; }
  }
  const atRealSize = () => Math.abs(arTarget.scale - 1) < 0.03;
  function placedHint() {
    const pct = Math.round(arTarget.scale * 100);
    hint.textContent = (atRealSize() ? (realSizeText ? "Real size · " + realSizeText : "Real size") : pct + "% of real size") + "\n" +
      (mode === "move" ? "Drag to move · twist to rotate · pinch to resize" : "Drag sideways to rotate · pinch to resize");
  }
  function setScale(v) {
    arTarget.scale = Math.min(3, Math.max(0.25, v));
    if (Math.abs(arTarget.scale - 1) < 0.03) arTarget.scale = 1;  // snap to real size
    sizeBtn.textContent = atRealSize() ? "Real size" : Math.round(arTarget.scale * 100) + "% ↺";
    if (document.activeElement !== sizeSlider) sizeSlider.value = String(Math.log2(arTarget.scale));
    if (arState === "placed") placedHint();
  }
  sizeBtn.addEventListener("click", () => setScale(1));
  sizeSlider.addEventListener("input", () => setScale(Math.pow(2, parseFloat(sizeSlider.value))));
  function setMode(m) {
    mode = m;
    document.getElementById("ar-move").setAttribute("aria-pressed", String(m === "move"));
    document.getElementById("ar-rotate").setAttribute("aria-pressed", String(m === "rotate"));
    if (arState === "placed") setArState("placed");
  }
  document.getElementById("ar-move").addEventListener("click", () => setMode("move"));
  document.getElementById("ar-rotate").addEventListener("click", () => setMode("rotate"));
  document.getElementById("ar-realign").addEventListener("click", () => { searchStart = performance.now(); setArState("searching"); });

  // The finger's point on the table: its ray from the AR camera meets the level plane the model stands on.
  function tablePoint(x, y) {
    const cam = xrCam();
    raycaster.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, 1 - y / innerHeight * 2), cam);
    const p = raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -arTarget.pos.y), new THREE.Vector3());
    return p && p.distanceTo(cam.getWorldPosition(new THREE.Vector3())) < 4 ? p : null;
  }
  const twoAngle = (t) => Math.atan2(t[1].clientY - t[0].clientY, t[1].clientX - t[0].clientX);
  const twoDist = (t) => Math.max(1, Math.hypot(t[1].clientX - t[0].clientX, t[1].clientY - t[0].clientY));
  function beginGesture(touches, wasMoved) {
    gesture = null;
    if (touches.length === 1) {
      const t = touches[0];
      gesture = { kind: 1, x0: t.clientX, y0: t.clientY, moved: wasMoved, yaw: arTarget.yaw };
      if (arState === "placed" && mode === "move") { const p = tablePoint(t.clientX, t.clientY); gesture.grab = p && arTarget.pos.clone().sub(p); }
    } else if (touches.length >= 2) gesture = { kind: 2, angle: twoAngle(touches), dist: twoDist(touches), scale: arTarget.scale, yaw: arTarget.yaw, moved: true };
  }
  const onControl = (e) => e.target.closest && e.target.closest("button, a");
  overlay.addEventListener("touchstart", (e) => {
    if (!xrSession || onControl(e)) return;
    if (e.touches.length === 1) downAt = e.timeStamp;
    beginGesture(e.touches, false);
  }, { passive: true });
  overlay.addEventListener("touchmove", (e) => {
    if (!xrSession || !gesture) return;
    if (gesture.kind === 1 && e.touches.length === 1) {
      const t = e.touches[0];
      if (Math.hypot(t.clientX - gesture.x0, t.clientY - gesture.y0) > 10) gesture.moved = true;
      if (arState !== "placed") return;
      if (mode === "rotate") arTarget.yaw = gesture.yaw + (t.clientX - gesture.x0) / innerWidth * Math.PI * 1.5;
      else if (gesture.grab) { const p = tablePoint(t.clientX, t.clientY); if (p) { arTarget.pos.x = p.x + gesture.grab.x; arTarget.pos.z = p.z + gesture.grab.z; } }
    } else if (gesture.kind === 2 && e.touches.length >= 2 && arState === "placed") {
      arTarget.yaw = gesture.yaw - (twoAngle(e.touches) - gesture.angle);
      setScale(gesture.scale * twoDist(e.touches) / gesture.dist);
    }
  }, { passive: true });
  overlay.addEventListener("touchend", (e) => {
    if (!xrSession || !gesture) return;
    const g = gesture;
    if (g.kind === 1 && !g.moved && !e.touches.length && e.timeStamp - downAt < 500 && arState === "searching" && splat.visible) setArState("placed");
    if (e.touches.length) beginGesture(e.touches, true); else gesture = null;  // re-anchor, so lifting one finger doesn't jump
  }, { passive: true });

  async function startAr() {
    xrSession = await navigator.xr.requestSession("immersive-ar", { optionalFeatures: ["hit-test", "local-floor", "dom-overlay"], domOverlay: { root: overlay } });
    renderer.xr.setReferenceSpaceType("local-floor");
    await renderer.xr.setSession(xrSession);
    overlay.classList.add("ar-on");
    splat.rotation.set(0, 0, 0); splat.scale.setScalar(baseScale); setScale(1); setMode("move");
    ring.scale.setScalar(footprint * 1.3);
    hint.hidden = false; searchStart = performance.now(); lastFrame = 0;
    try {
      const viewer = await xrSession.requestReferenceSpace("viewer");
      hitSource = await xrSession.requestHitTestSource({ space: viewer });
      splat.visible = false;
    } catch (e) {  // no hit-test: stand it on the floor 80 cm ahead; a tap places it
      hitSource = null; splat.visible = true; arTarget.pos.set(0, 0, -0.8); arTarget.yaw = 0; splat.position.copy(arTarget.pos);
    }
    setArState("searching");
    xrBtn.textContent = "Exit AR";
    xrSession.addEventListener("end", () => {
      xrSession = null; hitSource = null; gesture = null;
      overlay.classList.remove("ar-on"); hint.hidden = true; tools.hidden = true; sizer.hidden = true; ring.visible = false;
      splat.position.set(0, 0, 0); splat.rotation.set(0, 0, 0); splat.scale.setScalar(baseScale); splat.visible = true; splat.opacity = 1;
      if (shapeShadow) shapeShadow.material.opacity = 1;
      xrBtn.textContent = "View in your room";
    });
  }
  // Before placing: follow the surface under the middle of the screen (WebXR hit-tests only report real,
  // tracked surfaces, so the model never shows at a guessed depth).
  function followSurface(frame, now) {
    if (!hitSource || arState !== "searching" || !splatReady) return;
    const hit = frame.getHitTestResults(hitSource)[0];
    if (!hit) return;
    const pose = hit.getPose(renderer.xr.getReferenceSpace());
    if (!pose) return;
    const p = new THREE.Vector3().copy(pose.transform.position);
    const cam = xrCam().getWorldPosition(new THREE.Vector3());
    samples.push({ p, t: now });
    while (samples.length > 6 && now - samples[0].t > 1200) samples.shift();  // the last 1.2 s, and at least 6 hits
    const ys = samples.map((s) => s.p.y).sort((a, b) => a - b);
    arTarget.pos.set(p.x, ys[ys.length >> 1], p.z);
    arTarget.yaw = Math.atan2(cam.x - p.x, cam.z - p.z);
    if (!splat.visible) {  // spawn in place, fading in at real size
      splat.position.copy(arTarget.pos); splat.rotation.y = arTarget.yaw; splat.visible = true; fade = 0;
      setArState("searching");
    }
    const tol = Math.max(0.015, 0.035 * cam.distanceTo(arTarget.pos));
    const steady = samples.length >= 6 && samples.every((s) => s.p.distanceTo(arTarget.pos) < tol);
    if (!steady) stableSince = 0;
    else if (!stableSince) stableSince = now;
    else if (now - stableSince > 1200 && now - searchStart > 1500) setArState("placed");
  }
  window.__splatView = { state: () => ({ arState, mode, visible: splat.visible, opacity: splat.opacity, scale: splat.scale.x, baseScale, arScale: arTarget.scale, realSizeText,
    pos: splat.position.toArray(), target: arTarget.pos.toArray(), yaw: splat.rotation.y, targetYaw: arTarget.yaw, ring: ring.visible }) };  // for tests
  function updateAr(frame) {
    const now = performance.now();
    const dt = lastFrame ? Math.min(0.1, (now - lastFrame) / 1000) : 1 / 60;
    lastFrame = now;
    if (frame) followSurface(frame, now);
    if (!splat.visible) { ring.visible = false; return; }
    const goal = arState === "placed" ? 1 : GHOST;  // a see-through ghost while placing, solid once placed
    if (fade !== goal) {
      fade = fade < goal ? Math.min(goal, fade + dt / 0.35) : Math.max(goal, fade - dt / 0.25);
      splat.opacity = fade;
      if (shapeShadow) shapeShadow.material.opacity = goal === 1 ? fade : 0;
    }
    const k = 1 - Math.pow(arState === "searching" ? 0.82 : 0.6, dt * 60);  // frame-rate independent easing
    splat.position.lerp(arTarget.pos, k);
    const d = Math.atan2(Math.sin(arTarget.yaw - splat.rotation.y), Math.cos(arTarget.yaw - splat.rotation.y));
    splat.rotation.y += d * k;
    const sc = splat.scale.x / baseScale;
    splat.scale.setScalar(baseScale * (sc + (arTarget.scale - sc) * k));
    ring.scale.setScalar(footprint * 1.3 * splat.scale.x / baseScale);
    ring.position.set(splat.position.x, splat.position.y + 0.002, splat.position.z);
    ring.material.opacity = arState === "searching" ? 0.55 + 0.35 * Math.sin(now / 250) : Math.max(0, ring.material.opacity - dt * 3);
    ring.visible = ring.material.opacity > 0.01;
  }
  xrBtn.addEventListener("click", () => {
    if (xrSession) xrSession.end();
    else startAr().catch((e) => { console.error(e); msg.hidden = false; msg.textContent = "AR could not start on this device"; });
  });
  const ar8 = document.getElementById("ar8-btn");
  ar8.href = "splat-ar.html" + location.search;
  const webxrAr = navigator.xr && navigator.xr.isSessionSupported
    ? navigator.xr.isSessionSupported("immersive-ar").catch(() => false) : Promise.resolve(false);
  webxrAr.then((ok) => { xrBtn.hidden = !ok; ar8.hidden = ok || !phone; });

  renderer.setAnimationLoop((t, frame) => {
    if (!renderer.xr.isPresenting) {
      controls.target.y = Math.min(height, Math.max(0, controls.target.y));  // panning can't sink the view under the table
      controls.update();
    }
    else updateAr(frame);
    if (slosh) slosh.update(renderer.xr.isPresenting ? renderer.xr.getCamera() : camera);
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
